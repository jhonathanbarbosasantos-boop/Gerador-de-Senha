<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Gerador de Senhas</title>
</head>
<body>
    <main class="caixa">
        <h1>Gerador de Senhas</h1>
        <input type="text" id="senha" readonly placeholder="Senha gerada">
        <br>
        <label for="quantidade">Quantidade de Caracteres</label>
        <br>
        <input type="number" id="quantidade" value="8" min="1">
        <br>
        <label>
            Letras minusculas
            <input type="checkbox" id="minusculas" checked>
        </label>
        <br>
        <label>
            Letras Maiusculas
            <input type="checkbox" id="maiusculas" checked>
        </label>
        <br>
        <label>
            Numeros
            <input type="checkbox" id="numeros">
        </label>
        <br>
        <label>
            Caracteres Especiais
            <input type="checkbox" id="especiais">
        </label>
        <br>
        <button onclick="criarSenha()">Criar Senha</button>
        <br>
        <button onclick="limparSenha()">Limpar Senha</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
